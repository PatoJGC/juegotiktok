<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Live Mobile Battle Arena</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    /* HUD Vertical para Celular */
    #hud {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }
    .team-card {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border-radius: 12px;
      padding: 8px 14px;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 100px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    .team-card-a { border-bottom: 4px solid #ff4757; }
    .team-card-b { border-bottom: 4px solid #2ed573; }
    .team-title {
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .team-card-a .team-title { color: #ff6b81; }
    .team-card-b .team-title { color: #7bed9f; }
    .team-count {
      font-size: 24px;
      font-weight: 900;
    }
    .vs-badge {
      font-size: 18px;
      font-weight: 900;
      font-style: italic;
      color: #eccc68;
      background: rgba(0,0,0,0.6);
      padding: 6px 10px;
      border-radius: 50%;
      border: 1px solid #eccc68;
    }

    /* Panel de Control Flotante */
    #sim-panel {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 12px;
      border-radius: 20px;
      display: flex;
      gap: 6px;
      align-items: center;
      z-index: 100;
      max-width: 95vw;
      flex-wrap: wrap;
      justify-content: center;
    }
    #sim-panel input, #sim-panel select, #sim-panel button {
      padding: 5px 8px;
      border-radius: 12px;
      border: none;
      outline: none;
      font-size: 11px;
    }
    #sim-panel input[type="text"] {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      width: 90px;
    }
    #sim-panel select { background: #2f3542; color: #fff; }
    #sim-panel button {
      background: linear-gradient(135deg, #70a1ff, #1e90ff);
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #ff4757;
      display: inline-block;
    }
    .status-dot.connected {
      background: #2ed573;
      box-shadow: 0 0 6px #2ed573;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>

  <div id="game-container">
    <div id="hud">
      <div class="team-card team-card-a">
        <div class="team-title">EQUIPO A</div>
        <div id="count-a" class="team-count">0</div>
      </div>

      <div class="vs-badge">VS</div>

      <div class="team-card team-card-b">
        <div class="team-title">EQUIPO B</div>
        <div id="count-b" class="team-count">0</div>
      </div>
    </div>

    <!-- Panel de Prueba Local -->
    <div id="sim-panel">
      <span id="ws-status-dot" class="status-dot" title="Estado TikFinity"></span>
      <input type="text" id="sim-user" placeholder="Usuario" value="User1">
      <select id="sim-action">
        <option value="A">Equipo A (Arriba)</option>
        <option value="B">Equipo B (Abajo)</option>
        <option value="GIFT_SMALL">Regalo 1 Coin</option>
        <option value="GIFT_MEDIUM">Regalo 10 Coins</option>
        <option value="GIFT_LARGE">Regalo 100 Coins</option>
      </select>
      <button onclick="triggerSimulation()">Probar</button>
      <button onclick="toggleSimPanel()" style="background:#57606f;">Ocultar</button>
    </div>
  </div>

<script>
  const Engine = Matter.Engine,
        Render = Matter.Render,
        Runner = Matter.Runner,
        Bodies = Matter.Bodies,
        Composite = Matter.Composite,
        Vector = Matter.Vector,
        Events = Matter.Events,
        Body = Matter.Body;

  const engine = Engine.create({ gravity: { x: 0, y: 0.3 } });
  const container = document.getElementById('game-container');
  const width = window.innerWidth;
  const height = window.innerHeight;

  const render = Render.create({
    element: container,
    engine: engine,
    options: { width: width, height: height, wireframes: false, background: 'transparent' }
  });

  Render.run(render);
  const runner = Runner.create();
  Runner.run(runner, engine);

  // Bordes ajustados
  const wallOptions = { isStatic: true, restitution: 0.9, friction: 0.1, render: { visible: false } };
  const wallThickness = 100;

  Composite.add(engine.world, [
    Bodies.rectangle(width / 2, height + wallThickness/2 - 10, width * 2, wallThickness, wallOptions),
    Bodies.rectangle(-wallThickness/2, height / 2, wallThickness, height * 2, wallOptions),
    Bodies.rectangle(width + wallThickness/2, height / 2, wallThickness, height * 2, wallOptions),
    Bodies.rectangle(width / 2, -wallThickness/2, width * 2, wallThickness, wallOptions)
  ]);

  const players = {};
  let countA = 0, countB = 0;

  class Fighter {
    constructor(username, avatarUrl, team) {
      this.username = username;
      this.team = team;
      // Ajuste de escala para pantallas estrechas de celular
      this.radius = Math.min(width, height) * 0.055; 
      if (this.radius < 24) this.radius = 24;

      this.maxHp = 100;
      this.hp = 100;
      this.power = 15;
      
      // Spawn Vertical: A arriba, B abajo
      const spawnX = width * 0.2 + (Math.random() * width * 0.6);
      const spawnY = team === 'A' ? height * 0.25 : height * 0.75;

      this.body = Bodies.circle(spawnX, spawnY, this.radius, {
        restitution: 0.85,
        friction: 0.05,
        frictionAir: 0.015,
        density: 0.002,
        render: { visible: false }
      });

      this.body.pluginFighter = this;
      this.avatarImg = new Image();
      this.avatarImg.src = avatarUrl || `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(username)}`;

      this.hitFlash = 0;
      this.buffEffect = 0;

      Composite.add(engine.world, this.body);
    }

    applyBuff(type) {
      this.buffEffect = 30;
      if (type === 'GIFT_SMALL') {
        this.maxHp += 30;
        this.hp = Math.min(this.hp + 40, this.maxHp);
      } else if (type === 'GIFT_MEDIUM') {
        this.power += 12;
      } else if (type === 'GIFT_LARGE') {
        this.maxHp += 100;
        this.hp += 100;
        this.power += 25;
        this.radius *= 1.2;
        Body.scale(this.body, 1.2, 1.2);
      }
      Body.applyForce(this.body, this.body.position, { x: (Math.random()-0.5)*0.02, y: this.team === 'A' ? 0.03 : -0.03 });
    }

    takeDamage(amount, attackerPos) {
      this.hp -= amount;
      this.hitFlash = 10;
      if (attackerPos) {
        const forceDir = Vector.normalise(Vector.sub(this.body.position, attackerPos));
        Body.applyForce(this.body, this.body.position, Vector.mult(forceDir, 0.025 * (amount / 10)));
      }
      if (this.hp <= 0) this.destroy();
    }

    destroy() {
      createExplosion(this.body.position.x, this.body.position.y, this.team === 'A' ? '#ff4757' : '#2ed573');
      Composite.remove(engine.world, this.body);
      delete players[this.username];
      if (this.team === 'A') countA--; else countB--;
      updateScores();
    }
  }

  // IA de Ataque
  setInterval(() => {
    const all = Object.values(players);
    const teamA = all.filter(p => p.team === 'A');
    const teamB = all.filter(p => p.team === 'B');

    all.forEach(f => {
      const targets = f.team === 'A' ? teamB : teamA;
      if (targets.length > 0) {
        let closest = targets[0], minDist = Infinity;
        targets.forEach(t => {
          const d = Vector.magnitudeSquared(Vector.sub(t.body.position, f.body.position));
          if (d < minDist) { minDist = d; closest = t; }
        });
        const dir = Vector.normalise(Vector.sub(closest.body.position, f.body.position));
        Body.applyForce(f.body, f.body.position, Vector.mult(dir, 0.006 * f.body.mass));
      }
    });
  }, 1000);

  // Colisiones
  Events.on(engine, 'collisionStart', event => {
    event.pairs.forEach(pair => {
      const f1 = pair.bodyA.pluginFighter;
      const f2 = pair.bodyB.pluginFighter;
      if (f1 && f2 && f1.team !== f2.team) {
        const speed = Vector.magnitude(pair.bodyA.velocity) + Vector.magnitude(pair.bodyB.velocity);
        f2.takeDamage(Math.max(5, Math.round(f1.power * (1 + speed * 0.1))), pair.bodyA.position);
        f1.takeDamage(Math.max(5, Math.round(f2.power * (1 + speed * 0.1))), pair.bodyB.position);
      }
    });
  });

  // Render
  const particles = [];
  function createExplosion(x, y, color) {
    for (let i = 0; i < 18; i++) particles.push({ x, y, vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10, radius: Math.random()*5+2, color, life: 1 });
  }

  Events.on(render, 'afterRender', () => {
    const ctx = render.context;

    // Partículas
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.life -= 0.035;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      ctx.save(); ctx.globalAlpha = p.life; ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fillStyle = p.color; ctx.fill(); ctx.restore();
    }

    // Jugadores
    Object.values(players).forEach(f => {
      const pos = f.body.position;
      ctx.save();
      ctx.translate(pos.x, pos.y);

      ctx.shadowBlur = f.hitFlash > 0 ? 18 : (f.buffEffect > 0 ? 22 : 10);
      ctx.shadowColor = f.hitFlash > 0 ? '#fff' : (f.buffEffect > 0 ? '#eccc68' : (f.team === 'A' ? '#ff4757' : '#2ed573'));

      ctx.beginPath();
      ctx.arc(0, 0, f.radius, 0, Math.PI * 2);
      ctx.fillStyle = f.team === 'A' ? '#ff4757' : '#2ed573';
      ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();

      if (f.avatarImg.complete && f.avatarImg.naturalWidth !== 0) {
        ctx.beginPath();
        ctx.arc(0, 0, f.radius - 2, 0, Math.PI * 2);
        ctx.clip();
        ctx.drawImage(f.avatarImg, -f.radius + 2, -f.radius + 2, (f.radius - 2) * 2, (f.radius - 2) * 2);
      }
      ctx.restore();

      // Barra de Vida
      const bw = f.radius * 2, bh = 5, bx = pos.x - bw / 2, by = pos.y - f.radius - 10;
      ctx.fillStyle = 'rgba(0, 0, 0, 0.6)'; ctx.fillRect(bx, by, bw, bh);
      const ratio = Math.max(0, f.hp / f.maxHp);
      ctx.fillStyle = ratio > 0.5 ? '#2ed573' : (ratio > 0.25 ? '#ffa502' : '#ff4757');
      ctx.fillRect(bx, by, bw * ratio, bh);

      // Nombre
      ctx.fillStyle = '#fff'; ctx.font = 'bold 11px Segoe UI'; ctx.textAlign = 'center';
      ctx.fillText(f.username, pos.x, pos.y + f.radius + 14);
    });
  });

  function processUserAction(username, avatar, choice) {
    if (!players[username]) {
      players[username] = new Fighter(username, avatar, choice);
      if (choice === 'A') countA++; else countB++;
      updateScores();
    }
  }

  function processGift(username, giftType) {
    if (players[username]) players[username].applyBuff(giftType);
  }

  function updateScores() {
    document.getElementById('count-a').innerText = countA;
    document.getElementById('count-b').innerText = countB;
  }

  // TikFinity WebSocket
  function initWS() {
    const ws = new WebSocket("ws://localhost:21213/");
    ws.onopen = () => document.getElementById('ws-status-dot').classList.add('connected');
    ws.onmessage = e => {
      const data = JSON.parse(e.data);
      if (data.event === "chat" || data.comment) {
        const txt = (data.comment || "").trim().toUpperCase();
        if (txt === "A" || txt === "B") processUserAction(data.nickname || data.uniqueId, data.profilePictureUrl, txt);
      }
      if (data.event === "gift") {
        const coins = data.diamondCount || 1;
        const giftType = coins >= 100 ? 'GIFT_LARGE' : (coins >= 10 ? 'GIFT_MEDIUM' : 'GIFT_SMALL');
        processGift(data.nickname || data.uniqueId, giftType);
      }
    };
    ws.onclose = () => {
      document.getElementById('ws-status-dot').classList.remove('connected');
      setTimeout(initWS, 4000);
    };
  }
  initWS();

  function triggerSimulation() {
    const user = document.getElementById('sim-user').value || 'User' + Math.floor(Math.random()*100);
    const act = document.getElementById('sim-action').value;
    if (act === 'A' || act === 'B') processUserAction(user, null, act);
    else processGift(user, act);
  }

  function toggleSimPanel() {
    const p = document.getElementById('sim-panel');
    p.style.display = p.style.display === 'none' ? 'flex' : 'none';
  }

  window.addEventListener('resize', () => {
    render.canvas.width = window.innerWidth;
    render.canvas.height = window.innerHeight;
  });
</script>
</body>
</html>
